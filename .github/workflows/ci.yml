name: CI

on:
  push:
    branches: [ master ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    uses: evolution-gaming/scala-github-actions/.github/workflows/ci.yml@144b8762ece97a25b24621f9d470542fa1e068b4 # v7.2.0
    with:
      # if changing binary Scala versions here, change in the build.sbt as well
      scala_versions: '["2.13.x", "3.3.x"]'
      java_version_file: '.java-version'
